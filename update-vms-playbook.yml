---
- hosts: all
  become: true
  gather_facts: true
  vars:
    should_reboot: "{{ update_reboot | default(false) | bool }}"

  tasks:
    - name: Refresh apt package index
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_upgrade_result

    - name: Check whether reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Show VM update result
      debug:
        msg: >-
          Updated {{ inventory_hostname }};
          changed={{ apt_upgrade_result.changed | default(false) }};
          reboot_required={{ reboot_required_file.stat.exists | default(false) }}

    - name: Reboot updated host when requested
      reboot:
        msg: Reboot triggered by startup ansible update-vms
        reboot_timeout: 1800
        connect_timeout: 5
      when:
        - should_reboot
        - reboot_required_file.stat.exists | default(false)
