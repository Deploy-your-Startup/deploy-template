---
# Point a project's domains at its cluster through Hetzner DNS only.
# Run by `startup ansible dns`. It creates the Hetzner zone and A records and
# touches no server, network or firewall, so startups attached to a shared
# cluster can manage their own DNS. The CLI imports the project's group_vars
# (base_domain, additional_domains) and passes dns_target_ip, the cluster's
# public ingress address.
- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: "Require the cluster address the domains must resolve to"
      ansible.builtin.assert:
        that:
          - dns_target_ip is defined
          - dns_target_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
        fail_msg: "dns_target_ip must be the cluster's public IPv4 address."
      tags: always

    - name: "Manage the project's DNS zone and records"
      ansible.builtin.import_role:
        name: hetzner-dns
      vars:
        loadbalancer_ip: "{{ dns_target_ip }}"
        domains: "{{ [base_domain] + (additional_domains | default([])) }}"
