name: "Coverage report"
description: >-
  Add Cobertura coverage files to the job summary and a sticky pull request
  comment. Required mode fails on missing or invalid reports.
inputs:
  files:
    description: >-
      One NAME=PATH pair per line, for example `backend=backend/coverage/cobertura.xml`.
    required: true
  required:
    description: 'Fail if any configured report is missing or invalid'
    required: false
    default: 'false'
  title:
    description: "Heading of the summary and the comment"
    required: false
    default: "Coverage"
  measured_from:
    description: "Test suites that produced all supplied reports, e.g. Integration, E2E, Unit or Integration + E2E"
    required: false
    default: ""
  comment_key:
    description: "Identifies the sticky comment to update; defaults to the title"
    required: false
    default: ""
  github_token:
    description: "Token allowed to write pull request comments"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Report coverage"
      shell: "bash"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        COVERAGE_REQUIRED: ${{ inputs.required }}
        COVERAGE_FILES: ${{ inputs.files }}
        COVERAGE_TITLE: ${{ inputs.title }}
        COVERAGE_MEASURED_FROM: ${{ inputs.measured_from }}
        COVERAGE_KEY: ${{ inputs.comment_key }}
      run: |
        mapfile -t files < <(printf '%s\n' "$COVERAGE_FILES" | sed '/^[[:space:]]*$/d')
        required_args=()
        if [ "$COVERAGE_REQUIRED" = true ]; then required_args+=(--required); fi
        python3 "${{ github.action_path }}/report.py" --title "$COVERAGE_TITLE" --measured-from "$COVERAGE_MEASURED_FROM" ${COVERAGE_KEY:+--key "$COVERAGE_KEY"} "${required_args[@]}" "${files[@]}"
