name: "Wait for infrastructure"
description: >-
  Require the latest infrastructure run for this branch to succeed before deploying.
inputs:
  timeout_minutes:
    description: "Fail if infrastructure is not successful within this many minutes"
    required: false
    default: "30"
  github_token:
    description: "Token used to read workflow runs"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Wait for a running infrastructure deploy"
      shell: "bash"
      env:
        GH_TOKEN: ${{ inputs.github_token || github.token }}
        STARTUP_WAIT_MINUTES: ${{ inputs.timeout_minutes }}
      run: bash "${{ github.action_path }}/wait.sh"
