name: "Deploy"
description: "Deploys the application with ansible"
inputs:
  environment:
    description: "Environment which should be deployed"
    required: true
    default: "production"
  service:
    description: "Service to deploy"
    required: false
    default: ""
  vault_password:
    description: "Password for ansible vault"
    required: true
runs:
  using: "composite"
  steps:
    - name: "Set up uv"
      uses: astral-sh/setup-uv@v7
      with:
        working-directory: deployment
        python-version: 3.14
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock

    - name: "Sync deployment dependencies with uv"
      shell: "bash"
      working-directory: ./deployment
      run: |
        uv sync --frozen --python 3.14

    - name: "Expose deployment venv executables"
      shell: "bash"
      run: |
        echo "${{ github.workspace }}/deployment/.venv/bin" >> "$GITHUB_PATH"

    - name: Export shared Ansible roles
      shell: "bash"
      env:
        ACTION_REPO_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        source_root="$(cd "$ACTION_REPO_ROOT/../../.." && pwd)"
        destination="${{ github.workspace }}/deployment/.shared-roles"

        rm -rf "$destination"
        mkdir -p "$destination"

        cp -R "$source_root/roles" "$destination/roles"

        if [ -f "$source_root/ansible.cfg" ]; then
          cp "$source_root/ansible.cfg" "$destination/ansible.cfg"
        fi

        if [ -f "$source_root/requirements.yml" ]; then
          cp "$source_root/requirements.yml" "$destination/requirements.yml"
        fi

        if [ -f "$source_root/inventory.ini" ]; then
          cp "$source_root/inventory.ini" "$destination/inventory.ini"
        fi

        if [ -f "$source_root/inventory.hcloud.yml" ]; then
          cp "$source_root/inventory.hcloud.yml" "$destination/inventory.hcloud.yml"
        fi

        if [ -f "$source_root/backup-playbook.yml" ]; then
          cp "$source_root/backup-playbook.yml" "$destination/backup-playbook.yml"
        fi

        if [ -f "$source_root/restore-playbook.yml" ]; then
          cp "$source_root/restore-playbook.yml" "$destination/restore-playbook.yml"
        fi

    - name: Cache Ansible collections
      id: cache-collections
      uses: actions/cache@v6
      with:
        path: ~/.ansible/collections
        key: ansible-collections-${{ runner.os }}-${{ hashFiles('deployment/requirements.yml', 'deployment/.shared-roles/requirements.yml') }}
        restore-keys: |
          ansible-collections-${{ runner.os }}-
    
    - name: Setup shared Ansible roles and collections
      shell: "bash"
      working-directory: ./deployment
      run: |
        ./make.sh setup_ansible --no-refresh
    
    # Private network mode: the servers only listen on the tailnet, so the runner
    # has to join it before Ansible can reach them. Public projects skip both
    # steps. The OAuth client comes from the vault rather than GitHub secrets, so
    # it is managed with `startup secrets` like every other project secret.
    - name: "Read network mode"
      id: network
      shell: "bash"
      working-directory: ./deployment
      env:
        ENVIRONMENT: ${{ inputs.environment }}
        VAULT_PASSWORD: ${{ inputs.vault_password }}
      run: |
        set -euo pipefail
        # Same precedence as Ansible: the environment file overrides all.yml.
        mode="$(grep -hE '^network_mode:' group_vars/all.yml "group_vars/${ENVIRONMENT}.yml" 2>/dev/null \
          | tail -n 1 | sed -E "s/^network_mode:[[:space:]]*['\"]?([a-z]+).*/\1/")"
        mode="${mode:-public}"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        if [ "$mode" != "private" ]; then
          exit 0
        fi

        read_field() {
          local value=""
          for file in "group_vars/${ENVIRONMENT}.yml" group_vars/all.yml; do
            [ -f "$file" ] || continue
            value="$(startup secrets get-field -f "$file" --field "$1" -p "$VAULT_PASSWORD" 2>/dev/null || true)"
            [ -n "$value" ] && break
          done
          if [ -z "$value" ]; then
            echo "::error::network_mode is private, but $1 is not set in group_vars. Vault it with 'startup secrets update --field-stdin $1'." >&2
            exit 1
          fi
          printf '%s' "$value"
        }

        client_id="$(read_field tailscale_ci_oauth_client_id)"
        secret="$(read_field tailscale_ci_oauth_secret)"
        echo "::add-mask::$client_id"
        echo "::add-mask::$secret"
        {
          echo "oauth_client_id=$client_id"
          echo "oauth_secret=$secret"
        } >> "$GITHUB_OUTPUT"

    - name: "Join tailnet"
      if: steps.network.outputs.mode == 'private'
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ steps.network.outputs.oauth_client_id }}
        oauth-secret: ${{ steps.network.outputs.oauth_secret }}
        tags: tag:ci

    - name: "Start ssh agent and add ssh key to ssh-agent"
      shell: "bash"
      working-directory: ./deployment
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        ssh-agent -a $SSH_AUTH_SOCK > /dev/null &&
        echo ${{ inputs.vault_password }} | ansible-vault view ci_ssh_key --vault-password-file /bin/cat | ssh-add -
    
    - name: "Deploy frontend"
      shell: "bash"
      if: github.event_name != 'pull_request'
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      working-directory: ./deployment
      run: |
        if [ "${{ inputs.service }}" = "infrastructure" ]; then
          ./make.sh infrastructure --vault_password ${{ inputs.vault_password }} --environment ${{ inputs.environment }} --no-refresh
        elif [ -z "${{ inputs.service }}" ]; then
          ./make.sh deploy --vault_password ${{ inputs.vault_password }} --environment ${{ inputs.environment }} --no-refresh
        else
          ./make.sh deploy --vault_password ${{ inputs.vault_password }} --environment ${{ inputs.environment }} --service ${{ inputs.service }} --no-refresh
        fi
