name: Docker Test Build
description: Build test stage and run tests inside container

inputs:
  context:
    description: 'Build context'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: true
  image:
    description: 'Image name'
    required: true
  tag:
    description: 'Image tag'
    required: true
  database_url:
    description: 'Database connection string'
    required: true
  run_tests:
    description: >-
      Run `./make.sh test` in the test image. Separate from run_lint so a
      service with no test suite can still be linted, and vice versa.
    required: false
    default: 'true'
  run_lint:
    description: >-
      Run `./make.sh lint` in the test image before the tests. Off by default:
      this action serves every project at once, so a service whose make.sh does
      not answer the `lint` verb yet would fail here. Switch it on per service
      once that verb exists.
    required: false
    default: 'false' 
  additional_build_context:
    description: "key=path pairs for additional build contexts in docker e.g. shared=../shared"
    required: false
    default: ''
  require_coverage:
    description: 'Run ./make.sh coverage and fail if it produces no coverage/cobertura.xml'
    required: false
    default: 'false'
  coverage_dir:
    description: >-
      Host directory that receives `coverage/cobertura.xml` from the
      container's working directory after `./make.sh test`. Defaults to a
      directory below runner.temp.
    required: false
    default: ''

outputs:
  coverage_file:
    description: >-
      Path of the Cobertura file the tests wrote (`coverage/cobertura.xml` in
      the service), or empty when the service writes no coverage.
    value: ${{ steps.test.outputs.coverage_file }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build only up to test stage
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: test
        tags: test-image:${{ inputs.tag }}
        push: false
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-contexts: ${{ inputs.additional_build_context != '' && inputs.additional_build_context || '' }}


    # Lint runs in the same image as the tests, which is what keeps this action
    # language-agnostic: it asks for a verb and never learns whether the answer
    # is ruff and ty, or prettier and eslint.
    - name: Lint in container
      if: ${{ inputs.run_lint == 'true' }}
      shell: bash
      run: |
        echo "Linting using image: test-image:${{ inputs.tag }}"
        set -e
        docker run --rm test-image:${{ inputs.tag }} ./make.sh lint

    # The coverage file is the only thing that leaves the container; the
    # report step reads it as Cobertura and never learns the test tooling.
    - name: Run tests in container
      id: test
      if: ${{ inputs.run_tests == 'true' }}
      shell: bash
      env:
        REQUIRE_COVERAGE: ${{ inputs.require_coverage }}
        IMAGE: test-image:${{ inputs.tag }}
        DATABASE_URL: ${{ inputs.database_url }}
        COVERAGE_DIR: ${{ inputs.coverage_dir || format('{0}/coverage-{1}', runner.temp, inputs.tag) }}
      run: |
        bash "${{ github.action_path }}/run-tests.sh" "$IMAGE" "$DATABASE_URL" "$COVERAGE_DIR" "$REQUIRE_COVERAGE"
        if [ -f "$COVERAGE_DIR/cobertura.xml" ]; then
          echo "coverage_file=$COVERAGE_DIR/cobertura.xml" >> "$GITHUB_OUTPUT"
        fi
