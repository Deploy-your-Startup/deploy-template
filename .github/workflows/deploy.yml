name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment which should be deployed"
        required: true
        default: "production"
        type: string
    secrets:
      VAULT_PASSWORD:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment || github.event.inputs.environment }}-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the wait step below see in-progress infrastructure runs.
      actions: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Wait for infrastructure"
        if: github.event_name != 'pull_request'
        uses: Deploy-your-Startup/deploy-template/.github/actions/wait-for-infrastructure@main

      - name: "Deploy!!"
        if: github.event_name != 'pull_request'
        uses: Deploy-your-Startup/deploy-template/.github/actions/deploy@main
        with:
          environment: ${{ inputs.environment || github.event.inputs.environment || 'production' }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
