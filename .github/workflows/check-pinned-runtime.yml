name: Check immutable runtime dispatch
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pinned-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: GIVEN an immutable runtime from this repository's history
        run: |
          mkdir -p deployment
          revision="$(git rev-parse HEAD)"
          while read -r candidate; do
            if git cat-file -e "$candidate:.github/actions/export-shared-roles/action.yml" 2>/dev/null; then
              revision="$candidate"
              break
            fi
          done < <(git rev-list --skip=1 --max-count=100 HEAD)
          # Synced owner repositories have different commit IDs from the source.
          # A first sync has no historical runtime; still verify its immutable HEAD.
          printf '%s\n' "$revision" > deployment/shared-roles.ref
      - name: WHEN exporting the project's reviewed runtime through native GitHub actions
        uses: ./.github/actions/export-shared-roles
        with:
          destination: deployment/.shared-roles
      - name: THEN the export matches the pin, including every runtime playbook
        run: |
          expected="$(mktemp -d)"
          git archive "$(cat deployment/shared-roles.ref)" | tar -x -C "$expected"
          diff -r "$expected/roles" deployment/.shared-roles/roles
          for file in ansible.cfg requirements.yml inventory.ini inventory.hcloud.yml backup-playbook.yml restore-playbook.yml update-vms-playbook.yml os-upgrade-playbook.yml k3s-upgrade-playbook.yml dns-playbook.yml; do
            if [ -f "$expected/$file" ]; then
              cmp "$expected/$file" "deployment/.shared-roles/$file"
            fi
          done
