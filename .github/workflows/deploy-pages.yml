name: Deploy Static Site to Cloudflare Pages

on:
  workflow_call:
    inputs:
      project_name:
        description: "Cloudflare Pages project name"
        required: true
        type: string
      working_directory:
        description: "Path to the site source (where package.json lives)"
        required: false
        default: frontend
        type: string
      node_version:
        description: "Node.js version"
        required: false
        default: "22"
        type: string
      build_output:
        description: "Build output directory, relative to working_directory"
        required: false
        default: dist
        type: string
      branch:
        description: "Cloudflare Pages branch to deploy to"
        required: false
        default: main
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: pages-deploy-${{ github.ref }}-${{ inputs.project_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working_directory }}
          command: pages deploy ${{ inputs.build_output }} --project-name=${{ inputs.project_name }} --branch=${{ inputs.branch }}
