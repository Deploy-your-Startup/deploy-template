name: Portable testing policy
on:
  pull_request:
    paths: ['**/AGENTS.md', 'docs/**', 'tests/test_testing_policy_integration.py', 'tests/test_agent_links_integration.py', '**/*.md', '.github/workflows/testing-policy.yml']
  push:
    branches: [main]
    paths: ['**/AGENTS.md', 'docs/**', 'tests/test_testing_policy_integration.py', 'tests/test_agent_links_integration.py', '**/*.md', '.github/workflows/testing-policy.yml']
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Follow the real standalone agent instructions
        run: |
          python3 tests/test_agent_links_integration.py
          python3 tests/test_testing_policy_integration.py
