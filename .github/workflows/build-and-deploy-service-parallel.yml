name: Parallel Build and Deploy Service

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy"
        required: false
        default: production
        type: string
      service:
        description: "Service to build and deploy (e.g., backend, frontend)"
        required: true
        type: string
      services:
        description: 'Optional JSON array of service objects; one E2E gate protects all services'
        type: string
        default: ''
      reuse_pr_build:
        description: "Reuse a verified equivalent PR build on push; false forces fresh checks"
        type: boolean
        default: true
      run_tests:
        description: "Whether to run tests"
        required: false
        default: true
        type: boolean
      run_lint:
        description: >-
          Whether to run `./make.sh lint` before the tests. Off by default so a
          service that does not answer the `lint` verb yet keeps deploying;
          switch it on once its make.sh has one.
        required: false
        default: false
        type: boolean
      require_coverage:
        description: "Require a valid coverage/cobertura.xml from ./make.sh coverage"
        required: false
        default: false
        type: boolean
      coverage_measured_from:
        description: "Test suites measured by the service coverage command (e.g. Integration)"
        required: false
        default: ""
        type: string
      run_e2e:
        description: "Gate deployment on the project's container E2E suite"
        type: boolean
        default: false
      e2e_shards:
        description: "Number of isolated E2E jobs (1-8)"
        type: number
        default: 1
      e2e_directory:
        description: "Directory containing the E2E Dockerfile and compose.yml"
        type: string
        default: e2e_tests
      platforms:
        description: "Comma‑separated list of target platforms (e.g. linux/amd64,linux/arm64)"
        required: false
        default: "linux/amd64"
        type: string
      additional_build_context:
        description: "key=path pairs for additional build contexts in docker e.g. shared=../shared"
        required: false
        default: ""
        type: string
    secrets:
      VAULT_PASSWORD:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.environment }}-${{ inputs.service }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-${{ inputs.service }}
  DOCKER_IMAGE_TAG: ${{ github.run_number }}
  DEPLOY_VERSION_PARAMETER_NAME: ${{ inputs.service }}_version

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.services.outputs.matrix }}
      revision: ${{ steps.runtime.outputs.revision }}
      reuse: ${{ steps.verified.outputs.reuse }}
      proof_id: ${{ steps.verified.outputs.proof_id }}
    steps:
      - id: services
        name: Resolve service matrix
        env:
          SERVICES: ${{ inputs.services }}
          DEFAULTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          defaults = json.loads(os.environ["DEFAULTS"])
          services = json.loads(os.environ["SERVICES"]) if os.environ["SERVICES"] else [{"service": defaults["service"]}]
          if not isinstance(services, list) or not 1 <= len(services) <= 16:
              raise SystemExit("services must contain 1-16 service objects")
          result, names = [], set()
          keys = ("service", "run_tests", "run_lint", "require_coverage", "coverage_measured_from", "platforms", "additional_build_context")
          for item in services:
              if not isinstance(item, dict) or set(item) - set(keys):
                  raise SystemExit("Unknown service configuration")
              config = {key: item.get(key, defaults[key]) for key in keys}
              name = config["service"]
              if not isinstance(name, str) or not re.fullmatch(r"[a-zA-Z0-9_-]+", name) or name in names:
                  raise SystemExit("Service names must be unique directory names")
              names.add(name)
              for key in ("run_tests", "run_lint", "require_coverage"):
                  if not isinstance(config[key], bool):
                      raise SystemExit(key + " must be boolean")
              if config["require_coverage"] and not config["run_tests"]:
                  raise SystemExit("require_coverage needs run_tests=true")
              result.append(config)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": result}) + "\n")
          PYTHON

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: runtime
        uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/pin-ci-runtime@main
      - id: verified
        uses: ./.git/startup-actions/verified-build
        with:
          mode: prepare
          configuration: ${{ toJSON(inputs) }}
          matrix: ${{ steps.services.outputs.matrix }}
          revision: ${{ steps.runtime.outputs.revision }}

  build:
    if: needs.prepare.outputs.reuse != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.service }}
      DEPLOY_VERSION_PARAMETER_NAME: ${{ matrix.service }}_version
    permissions:
      contents: read
      # Sticky coverage comment on pull requests (actions/coverage-report).
      pull-requests: write

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: pa55w0rt
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Validate coverage configuration"
        if: ${{ matrix.require_coverage && !matrix.run_tests }}
        run: |
          echo "::error::require_coverage needs run_tests=true"
          exit 1

      - name: "Setup environment"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/pin-ci-runtime@main
        with:
          revision: ${{ needs.prepare.outputs.revision }}

      # Runs whenever either check is wanted: the image is the same, and a
      # service with no test suite still needs somewhere to be linted.
      - name: "Test Docker Image"
        id: test
        if: ${{ matrix.run_tests || matrix.run_lint }}
        uses: ./.git/startup-actions/docker-test
        with:
          context: ./${{ matrix.service }}
          dockerfile: ./${{ matrix.service }}/Dockerfile
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tag: ${{ env.DOCKER_IMAGE_TAG }}
          database_url: "postgres://postgres:pa55w0rt@localhost:5432/test_db"
          additional_build_context: ${{ matrix.additional_build_context }}
          run_tests: ${{ matrix.run_tests }}
          run_lint: ${{ matrix.run_lint }}
          require_coverage: ${{ matrix.require_coverage }}
          cache_scope: ${{ matrix.service }}-test

      # Required coverage validates the report before publishing. No percentage
      # threshold is enforced; existing services remain opt-in.
      - name: "Report coverage"
        if: ${{ steps.test.outputs.coverage_file != '' }}
        uses: ./.git/startup-actions/coverage-report
        with:
          required: ${{ matrix.require_coverage }}
          title: "Coverage: ${{ matrix.service }}"
          measured_from: ${{ matrix.coverage_measured_from }}
          comment_key: ${{ matrix.service }}
          files: ${{ matrix.service }}=${{ steps.test.outputs.coverage_file }}

      - name: "Upload coverage"
        if: ${{ steps.test.outputs.coverage_file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ steps.test.outputs.coverage_file }}
          if-no-files-found: error

  # Build once while checks run. Publish the exact OCI archive after the gate;
  # no second build can resolve a different base image or dependency.
  image:
    if: needs.prepare.outputs.reuse != 'true'
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.service }}
      DEPLOY_VERSION_PARAMETER_NAME: ${{ matrix.service }}_version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/production-image.tar
          platforms: ${{ matrix.platforms }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}-production
            type=gha,scope=${{ matrix.service }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-production
          build-contexts: ${{ matrix.additional_build_context }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.service }}-production-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-image.tar
          compression-level: 0
          retention-days: 1

  e2e:
    needs: prepare
    if: inputs.run_e2e && needs.prepare.outputs.reuse != 'true'
    uses: ./.github/workflows/container-e2e.yml
    permissions:
      contents: read
    with:
      directory: ${{ inputs.e2e_directory }}
      shards: ${{ inputs.e2e_shards }}
      artifact_prefix: ${{ inputs.service }}
      runtime_revision: ${{ needs.prepare.outputs.revision }}

  checks:
    name: Required checks
    if: always()
    needs: [prepare, build, image, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every enabled check
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REUSE: ${{ needs.prepare.outputs.reuse }}
          PROOF_ID: ${{ needs.prepare.outputs.proof_id }}
          INTEGRATION_RESULT: ${{ needs.build.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          RUN_E2E: ${{ inputs.run_e2e }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$REUSE" = true ]; then
            test -n "$PROOF_ID"
            test "$INTEGRATION_RESULT" = skipped
            test "$IMAGE_RESULT" = skipped
            test "$E2E_RESULT" = skipped
            exit 0
          fi
          test "$INTEGRATION_RESULT" = success
          test "$IMAGE_RESULT" = success
          if [ "$RUN_E2E" = true ]; then test "$E2E_RESULT" = success; fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request' && inputs.reuse_pr_build
      - uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/pin-ci-runtime@main
        if: github.event_name == 'pull_request' && inputs.reuse_pr_build
        with:
          revision: ${{ needs.prepare.outputs.revision }}
      - id: evidence
        if: github.event_name == 'pull_request' && inputs.reuse_pr_build
        uses: ./.git/startup-actions/verified-build
        with:
          mode: record
          configuration: ${{ toJSON(inputs) }}
          matrix: ${{ needs.prepare.outputs.matrix }}
          revision: ${{ needs.prepare.outputs.revision }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.evidence.outputs.record == 'true'
        with:
          name: verified-pr-${{ steps.evidence.outputs.key }}
          overwrite: true
          path: ${{ runner.temp }}/verified-build/proof.json
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ always() && github.event_name != 'pull_request' && needs.checks.result == 'success' && needs.prepare.result == 'success' }}
    needs: [checks, prepare]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_NAME: ${{ github.repository }}-${{ matrix.service }}
      DEPLOY_VERSION_PARAMETER_NAME: ${{ matrix.service }}_version
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/pin-ci-runtime@main
        if: needs.prepare.outputs.reuse == 'true'
        with:
          revision: ${{ needs.prepare.outputs.revision }}
      - name: Restore verified PR image
        if: needs.prepare.outputs.reuse == 'true'
        uses: ./.git/startup-actions/verified-build
        with:
          mode: restore
          configuration: ${{ toJSON(inputs) }}
          matrix: ${{ needs.prepare.outputs.matrix }}
          revision: ${{ needs.prepare.outputs.revision }}
          proof_id: ${{ needs.prepare.outputs.proof_id }}
          service: ${{ matrix.service }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.prepare.outputs.reuse != 'true'
        with:
          name: ${{ matrix.service }}-production-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Install image transfer tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Publish checked image without rebuilding
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ env.DOCKER_IMAGE_TAG }}
        run: |
          skopeo copy --all --authfile "$HOME/.docker/config.json" \
            "oci-archive:$RUNNER_TEMP/production-image.tar" "docker://$IMAGE:$TAG"
          skopeo copy --all --authfile "$HOME/.docker/config.json" \
            "docker://$IMAGE:$TAG" "docker://$IMAGE:latest"
      - name: Wait for infrastructure
        uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/wait-for-infrastructure@main
      - name: Deploy service
        uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/deploy@main
        with:
          environment: ${{ inputs.environment }}
          service: ${{ matrix.service }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}
