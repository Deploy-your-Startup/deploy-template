name: Check Ansible roles

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-roles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: Install pinned check dependencies
        run: uv sync --locked
      # The KPI login E2E launches headless Chromium only; the lockfile pins
      # its build, so the download is cached while system libraries still install.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install browser for KPI login E2E
        run: uv run --locked playwright install --with-deps --only-shell chromium
      - name: Validate role structure
        run: ./make.sh lint
      - name: Check Ansible syntax and safety regressions
        env:
          STARTUP_REQUIRE_DOCKER_TESTS: '1'
        # DIAGNOSTIC (temporary): repeat the suite to catch the KPI browser flake.
        run: |
          status=0
          for round in 1 2 3 4 5; do echo "ROUND $round"; uv run --locked pytest -n auto --dist loadgroup -s -q -p no:cacheprovider 2>&1 | grep -E 'passed|failed|FAILED' || true; done; cat /tmp/kpidiag.log 2>/dev/null || echo 'no KPI browser failures recorded'
