name: Container E2E
on:
  workflow_call:
    inputs:
      directory:
        type: string
        default: e2e_tests
      shards:
        type: number
        default: 1
      runtime_revision:
        description: "Shared CI runtime resolved by the application workflow"
        type: string
        default: ''
      artifact_prefix:
        type: string
        default: e2e
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - id: matrix
        name: Validate shard count
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          count = int(os.environ["SHARDS"])
          if not 1 <= count <= 8:
              raise SystemExit("shards must be an integer between 1 and 8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("value=" + json.dumps(list(range(1, count + 1))) + "\n")
          PYTHON
      - id: mode
        name: Select CI browser tests
        env:
          RUN_E2E_IN_CI: ${{ vars.RUN_E2E_IN_CI || 'true' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$RUN_E2E_IN_CI" in
            true|false) ;;
            *) echo '::error::RUN_E2E_IN_CI must be true or false'; exit 1 ;;
          esac
          if [ "$RUN_E2E_IN_CI" = false ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '### E2E: disabled in CI' >> "$GITHUB_STEP_SUMMARY"
            echo 'Browser E2E was not executed in CI. Run all tests locally; CI does not verify that run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo '### E2E: CI execution required' >> "$GITHUB_STEP_SUMMARY"
          fi
  test:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/pin-ci-runtime@main
        if: inputs.runtime_revision != ''
        with:
          revision: ${{ inputs.runtime_revision }}
      - name: Build cached browser image on this runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.directory }}/Dockerfile
          tags: startup-e2e:${{ github.run_id }}
          load: true
          cache-from: type=gha,scope=${{ inputs.artifact_prefix }}-e2e
          cache-to: type=gha,mode=max,scope=${{ inputs.artifact_prefix }}-e2e
      - name: Run pinned isolated browser shard
        if: inputs.runtime_revision != ''
        uses: ./.git/startup-actions/container-e2e
        with:
          directory: ${{ inputs.directory }}
          image: startup-e2e:${{ github.run_id }}
          shard: ${{ matrix.shard }}
          total: ${{ inputs.shards }}
      - name: Run isolated browser shard
        if: inputs.runtime_revision == ''
        uses: §§deploy_your_startup.github_username§§/§§deploy_your_startup.deploy_repo_name§§/.github/actions/container-e2e@main
        with:
          directory: ${{ inputs.directory }}
          image: startup-e2e:${{ github.run_id }}
          shard: ${{ matrix.shard }}
          total: ${{ inputs.shards }}
      - name: Preserve reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact_prefix }}-e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-reports/
          if-no-files-found: error
          retention-days: 7
