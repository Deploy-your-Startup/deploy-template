---
- name: Install Longhorn prerequisites (packages)
  become: true
  apt:
    name:
      - nfs-common
      - open-iscsi
    state: present
    update_cache: true

- name: Ensure iscsid is enabled and running
  become: true
  service:
    name: iscsid
    enabled: true
    state: started

- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
    state: present

- name: Install/upgrade Longhorn via Helm
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    release_namespace: "{{ longhorn_namespace }}"
    create_namespace: true
    update_repo_cache: true
    state: present
    atomic: true
    wait: true
    timeout: "10m0s"   # or "600s" – Helm requires a duration with unit
    values:
      defaultSettings:
        defaultReplicaCount: "{{ longhorn_replica_count }}"
        backupstorePollInterval: "{{ longhorn_backup_poll_interval }}"
      csi:
        kubeletRootDir: "{{ kubelet_root_dir }}"