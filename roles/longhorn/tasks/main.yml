---
# Longhorn installation
- name: Create temporary directory for Longhorn
  ansible.builtin.file:
    path: "{{ longhorn_tmp_dir }}"
    state: directory
    mode: "0755"
  tags: longhorn

# Detect Kubernetes distribution
- name: Check if running on k3s
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: k3s_service
  tags: longhorn

- name: Check if running on microk8s
  ansible.builtin.stat:
    path: /var/snap/microk8s
  register: microk8s_dir
  tags: longhorn

# Set kubelet_root_dir based on detected distribution
- name: Set kubelet_root_dir for microk8s if detected
  ansible.builtin.set_fact:
    kubelet_root_dir: "/var/snap/microk8s/common/var/lib/kubelet"
  when: microk8s_dir.stat.exists
  tags: longhorn

# Auto-detect installation method if not explicitly set
- name: Auto-set installation method to k3s_helm if running on k3s
  ansible.builtin.set_fact:
    longhorn_install_method: "k3s_helm"
  when:
    - longhorn_install_method is not defined or longhorn_install_method == "auto"
    - k3s_service.stat.exists
  tags: longhorn

- name: Auto-set installation method to helm if not running on k3s
  ansible.builtin.set_fact:
    longhorn_install_method: "helm"
  when:
    - longhorn_install_method is not defined or longhorn_install_method == "auto"
    - not k3s_service.stat.exists
  tags: longhorn

# Choose installation method based on configuration
- name: "Install Longhorn using Helm CLI"
  ansible.builtin.include_tasks: install_with_helm.yml
  when: longhorn_install_method == "helm"
  tags: longhorn

- name: "Install Longhorn using k3s HelmChart resource"
  ansible.builtin.include_tasks: install_with_k3s_helm.yml
  when: longhorn_install_method == "k3s_helm"
  tags: longhorn

