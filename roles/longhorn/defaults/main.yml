# Longhorn version to install
longhorn_version: "v1.9.1"

# Default installation method: "helm" or "k3s_helm"
longhorn_install_method: "k3s_helm"

# Namespace for Longhorn
longhorn_namespace: "longhorn-system"

# Temporary directory for downloads
longhorn_tmp_dir: "/tmp/longhorn"

# Default settings
longhorn_replica_count: 3
longhorn_backup_poll_interval: 300

# Kubelet root directory - set based on your Kubernetes distribution
# For k3s
kubelet_root_dir: "/var/lib/kubelet"
# For microk8s (uncomment if needed)
# kubelet_root_dir: "/var/snap/microk8s/common/var/lib/kubelet"