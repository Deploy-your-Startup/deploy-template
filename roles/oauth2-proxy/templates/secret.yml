apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  namespace: "{{ k8s_namespace | default('default') }}"
type: Opaque
data:
  OAUTH2_PROXY_CLIENT_ID: "{{ oauth2_proxy_client_id | b64encode }}"
  OAUTH2_PROXY_CLIENT_SECRET: "{{ oauth2_proxy_client_secret | b64encode }}"
  # Raw or URL-safe encoded AES key from Vault; Kubernetes adds its own
  # base64 encoding around the value oauth2-proxy will read.
  OAUTH2_PROXY_COOKIE_SECRET: "{{ oauth2_proxy_cookie_secret | b64encode }}"
