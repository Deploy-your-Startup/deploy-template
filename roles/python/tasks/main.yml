---
- name: "Use distribution Python while preparing the isolated client"
  # set_fact outranks task vars. Reset the interpreter on repeated role imports
  # before apt/pip run, then switch back to the isolated client at the end.
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3

- name: "Install Python virtual environment support"
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-packaging
    state: present
    update_cache: true
    cache_valid_time: 3600
  vars:
    ansible_python_interpreter: /usr/bin/python3
  # Package hooks must not restart services in the middle of provisioning.
  # Ubuntu's cloud-init-hotplugd restart can block indefinitely on its FIFO.
  environment:
    NEEDRESTART_MODE: l

- name: "Check whether the isolated environment matches distribution Python"
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import pathlib, sys
        root = pathlib.Path(sys.argv[1])
        if not root.exists():
            print('missing')
        else:
            cfg = root / 'pyvenv.cfg'
            lines = cfg.read_text().splitlines() if cfg.exists() else []
            version = next((line.partition('=')[2].strip() for line in lines
                            if line.partition('=')[0].strip() == 'version'), '')
            expected = [str(sys.version_info.major), str(sys.version_info.minor)]
            print('ready' if version.split('.')[:2] == expected else 'rebuild')
      - "{{ kubernetes_python_venv }}"
  register: kubernetes_python_environment
  changed_when: false

- name: "Rebuild the isolated client after a distribution Python upgrade"
  ansible.builtin.command:
    argv: [/usr/bin/python3, -m, venv, --clear, "{{ kubernetes_python_venv }}"]
  when: kubernetes_python_environment.stdout == 'rebuild'

- name: "Install the pinned Kubernetes client in an isolated environment"
  ansible.builtin.pip:
    name: "kubernetes=={{ kubernetes_python_client_version }}"
    state: present
    virtualenv: "{{ kubernetes_python_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: "Use the isolated interpreter for subsequent Ansible modules"
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ kubernetes_python_venv }}/bin/python"
