---
- name: "Use distribution Python while preparing the isolated client"
  # set_fact outranks task vars. Reset the interpreter on repeated role imports
  # before apt/pip run, then switch back to the isolated client at the end.
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3

- name: "Install Python virtual environment support"
  ansible.builtin.apt:
    name:
      - python3-venv
      - python3-packaging
    state: present
    update_cache: true
    cache_valid_time: 3600
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: "Install the pinned Kubernetes client in an isolated environment"
  ansible.builtin.pip:
    name: "kubernetes=={{ kubernetes_python_client_version }}"
    state: present
    virtualenv: "{{ kubernetes_python_venv }}"
    virtualenv_command: /usr/bin/python3 -m venv
  vars:
    ansible_python_interpreter: /usr/bin/python3

- name: "Use the isolated interpreter for subsequent Ansible modules"
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ kubernetes_python_venv }}/bin/python"
