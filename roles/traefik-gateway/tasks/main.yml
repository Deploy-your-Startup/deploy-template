- name: "Install Gateway API CRDs"
  shell: |
    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.4.0/standard-install.yaml
  tags: traefik-gateway

- name: "Apply Traefik RBAC for Gateway API"
  shell: |
    kubectl apply -f https://raw.githubusercontent.com/traefik/traefik/v3.6/docs/content/reference/dynamic-configuration/kubernetes-gateway-rbac.yml
  tags: traefik-gateway

- name: "Create traefik-gateway namespace"
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: traefik-gateway
  tags: traefik-gateway

- name: "Add Traefik Helm repository"
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://helm.traefik.io/traefik
  tags: traefik-gateway

- name: "Install Traefik using Helm with Gateway API support"
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    release_namespace: traefik-gateway
    create_namespace: true
    values:
      providers:
        kubernetesGateway:
          enabled: true
          # experimentalChannel nur nötig, wenn du TCPRoute/TLSRoute brauchst
          # experimentalChannel: true

      gateway:
        enabled: true
        name: traefik-gateway
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod

        listeners:
          web:
            port: 8000
            protocol: HTTP
            namespacePolicy:
              from: All

          websecure:
            port: 8443
            protocol: HTTPS
            hostname: "*.{{ base_domain }}"
            namespacePolicy:
              from: All
            mode: Terminate
            certificateRefs:
              - name: base-domain-secret-tls
                kind: Secret
                group: ""

          websecure-root:
            port: 8443
            protocol: HTTPS
            hostname: "{{ base_domain }}"
            namespacePolicy:
              from: All
            mode: Terminate
            certificateRefs:
              - name: base-domain-root-secret-tls
                kind: Secret
                group: ""

      ports:
        web:
          port: 8000
          expose:
            default: true
          exposedPort: 80
          protocol: TCP

        websecure:
          port: 8443
          expose:
            default: true
          exposedPort: 443
          protocol: TCP
          tls:
            enabled: true                      # Service-Port TLS

      service:
        type: LoadBalancer
  tags: traefik-gateway

- name: "Wait for Traefik to be ready"
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: traefik
    namespace: traefik-gateway
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  tags: traefik-gateway
