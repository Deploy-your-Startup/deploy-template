# -----------------------------------------------------------------------------
# STEP 1: Get network info directly from server
# -----------------------------------------------------------------------------
- name: "Get private IP"
  shell: ip -o addr show | grep -v -E 'flannel|cni|veth|docker' | grep -E "inet 10\.[0-9]+\.[0-9]+\.[0-9]+" | awk '{print $4}' | cut -d'/' -f1 | head -1
  register: private_ip_result
  changed_when: false

- name: "Set node IP (private if available, otherwise public)"
  set_fact:
    node_private_ip: "{{ private_ip_result.stdout | default('', true) }}"
    has_private_network: "{{ private_ip_result.stdout | default('', true) | length > 0 }}"

- name: "Get flannel interface"
  shell: ip -o addr show | grep "{{ node_private_ip }}" | awk '{print $2}'
  register: flannel_iface_result
  changed_when: false
  when: has_private_network

- name: "Set flannel interface"
  set_fact:
    flannel_interface: "{{ flannel_iface_result.stdout | default('') }}"
  when: has_private_network

# -----------------------------------------------------------------------------
# STEP 2: Determine role from hostname
# -----------------------------------------------------------------------------
- name: "Set node role"
  set_fact:
    is_first_master: "{{ inventory_hostname.endswith('master-0') }}"
    is_master: "{{ 'master' in inventory_hostname }}"
    is_worker: "{{ 'worker' in inventory_hostname }}"
    first_master_host: "{{ inventory_hostname | regex_replace('(master|worker)-[0-9]+$', 'master-0') }}"

- name: "Debug"
  debug:
    msg: "{{ inventory_hostname }} | private_ip: {{ node_private_ip | default('none', true) }} | api_ip: {{ first_master_ip | default(ansible_host, true) }} | first_master: {{ is_first_master }} | master: {{ is_master }} | worker: {{ is_worker }}"

# -----------------------------------------------------------------------------
# STEP 3: Get first master IP
# -----------------------------------------------------------------------------
- name: "Get first master private IP"
  shell: ip -o addr show | grep -v -E 'flannel|cni|veth|docker' | grep -E "inet 10\.[0-9]+\.[0-9]+\.[0-9]+" | awk '{print $4}' | cut -d'/' -f1 | head -1
  register: first_master_ip_result
  delegate_to: "{{ first_master_host }}"
  changed_when: false
  when: has_private_network

- name: "Set first master IP"
  set_fact:
    first_master_ip: "{{ first_master_ip_result.stdout if has_private_network else hostvars[first_master_host]['ansible_host'] }}"

# -----------------------------------------------------------------------------
# STEP 4: First master - preflight + cluster init
# -----------------------------------------------------------------------------
- name: "Check existing k3s data"
  stat:
    path: /var/lib/rancher/k3s/server/db
  register: existing_k3s_db
  when: is_first_master

- name: "Check existing k3s service"
  shell: systemctl is-active --quiet k3s
  register: existing_k3s_service
  failed_when: false
  changed_when: false
  when: is_first_master and existing_k3s_db.stat.exists

- name: "Fail on stale k3s data"
  fail:
    msg: |
      Existing k3s data was found on this server, but the k3s API is not ready.

      This usually means the VPS was already used for another bootstrap/run and
      the local datastore is encrypted with a different k3s token. Reusing it
      would fail with:
        bootstrap data already found and encrypted with different token

      Use a fresh VPS, or explicitly reset k3s state on this server before
      running infrastructure again.
  when:
    - is_first_master
    - existing_k3s_db.stat.exists
    - existing_k3s_service is defined
    - existing_k3s_service.rc != 0

- name: "Install first master (cluster-init)"
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_TOKEN="{{ k3s_token }}" INSTALL_K3S_EXEC="server \
      --cluster-init \
      {% if has_private_network %}--node-ip={{ node_private_ip }} \
      --flannel-iface={{ flannel_interface }} \
      --tls-san={{ node_private_ip }} \
      {% endif %}--tls-san={{ ansible_host }} \
      --node-label=type=master" sh -
  register: first_master_install
  changed_when: "'No change' not in first_master_install.stderr"
  when: is_first_master and not existing_k3s_db.stat.exists

- name: "Wait for first master API"
  block:
    - name: "Wait for first master API"
      wait_for:
        host: "127.0.0.1"
        port: 6443
        timeout: 180
  rescue:
    - name: "Show k3s service status"
      shell: systemctl status k3s --no-pager || true
      register: k3s_status
      changed_when: false

    - name: "Show recent k3s logs"
      shell: journalctl -u k3s --no-pager -n 120 || true
      register: k3s_logs
      changed_when: false

    - name: "Fail with k3s diagnostics"
      fail:
        msg: |
          k3s API did not become ready on 127.0.0.1:6443.

          systemctl status k3s:
          {{ k3s_status.stdout }}

          recent k3s logs:
          {{ k3s_logs.stdout }}
  when: is_first_master

# -----------------------------------------------------------------------------
# STEP 5: Other masters - join
# -----------------------------------------------------------------------------
- name: "Wait for first master API"
  wait_for:
    host: "{{ first_master_ip }}"
    port: 6443
    timeout: 180
  when: is_master and not is_first_master

- name: "Join master"
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_TOKEN="{{ k3s_token }}" INSTALL_K3S_EXEC="server \
      --server=https://{{ first_master_ip }}:6443 \
      {% if has_private_network %}--node-ip={{ node_private_ip }} \
      --flannel-iface={{ flannel_interface }} \
      --tls-san={{ node_private_ip }} \
      {% endif %}--tls-san={{ ansible_host }} \
      --node-label=type=master" sh -
  register: join_master_install
  changed_when: "'No change' not in join_master_install.stderr"
  when: is_master and not is_first_master

# -----------------------------------------------------------------------------
# STEP 6: Workers - join
# -----------------------------------------------------------------------------
- name: "Wait for master API"
  wait_for:
    host: "{{ first_master_ip }}"
    port: 6443
    timeout: 180
  when: is_worker

- name: "Join worker"
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" K3S_TOKEN="{{ k3s_token }}" K3S_URL="https://{{ first_master_ip }}:6443" INSTALL_K3S_EXEC="agent \
      {% if has_private_network %}--node-ip={{ node_private_ip }} \
      --flannel-iface={{ flannel_interface }} \
      {% endif %}--node-label=type=worker" sh -
  register: join_worker_install
  changed_when: "'No change' not in join_worker_install.stderr"
  when: is_worker
