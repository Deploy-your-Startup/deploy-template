---
kind: PersistentVolume
apiVersion: v1
metadata:
  name: "{{ postgres_pv_name }}"
  namespace: "{{ k8s_namespace | default('default') }}"
  labels:
    app: postgres
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "{{ postgres_data_path }}"
---
