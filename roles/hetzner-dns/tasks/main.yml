---
# In private network mode the servers are only reachable over the tailnet, so
# the records must point at a tailnet address (100.x). The provisioning play
# that imports this role runs before any node has one, and hands in the master's
# ansible_host — which private mode turns into a MagicDNS name, not an IP.
# Writing that would fail at best. So the records are only written when the
# target is an IPv4 address; the project playbook re-imports this role after the
# tailscale role with loadbalancer_ip set to the master's tailscale_ipv4.
- name: "Skip DNS records without an IPv4 target"
  debug:
    msg: >-
      Not writing DNS records: '{{ loadbalancer_ip }}' is not an IPv4 address
      (network_mode={{ network_mode | default('public') }}). In private mode they
      are written after the nodes joined the tailnet.
  when: loadbalancer_ip is not match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
  tags: infrastructure

- name: "Write DNS records"
  include_tasks:
    file: records.yml
    apply:
      tags: infrastructure
  when: loadbalancer_ip is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
  tags: infrastructure
