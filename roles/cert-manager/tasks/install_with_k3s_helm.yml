---
- name: "Download Gateway API standard-install manifest"
  ansible.builtin.get_url:
    url: "https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"
    dest: "{{ cert_manager_tmp_dir }}/gateway-api-standard-install.yaml"
    mode: "0644"
  tags: cert-manager

- name: "Apply Gateway API standard-install manifest"
  kubernetes.core.k8s:
    state: present
    src: "{{ cert_manager_tmp_dir }}/gateway-api-standard-install.yaml"
    wait: true
  tags: cert-manager

- name: "Apply cert-manager HelmChart resource for k3s Helm controller"
  kubernetes.core.k8s:
    state: present
    namespace: "kube-system"
    definition: "{{ lookup('template', 'cert-manager-helmchart.yaml.j2') }}"
    wait: true
  tags: cert-manager

- name: "Wait for cert-manager namespace to be created"
  kubernetes.core.k8s_info:
    kind: Namespace
    name: cert-manager
  register: cert_manager_ns
  until: cert_manager_ns.resources | length > 0
  retries: 30
  delay: 10
  tags: cert-manager

- name: "Wait for cert-manager deployment to be ready"
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: cert-manager
    name: cert-manager
  register: cert_manager_deployment
  until: >
    cert_manager_deployment.resources | length > 0 and
    cert_manager_deployment.resources[0].status.readyReplicas is defined and
    cert_manager_deployment.resources[0].status.readyReplicas >= 1
  retries: 30
  delay: 10
  tags: cert-manager

- name: "Wait for cert-manager CRDs to be available"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: issuers.cert-manager.io
  register: issuer_crd
  until: >
    issuer_crd.resources | length > 0 and
    issuer_crd.resources[0].status.conditions is defined and
    issuer_crd.resources[0].status.conditions | selectattr('type', 'equalto', 'Established') | selectattr('status', 'equalto', 'True') | list | length > 0
  retries: 30
  delay: 10
  tags: cert-manager

- name: "Apply Hetzner webhook HelmChart resource"
  kubernetes.core.k8s:
    state: present
    namespace: "kube-system"
    definition: "{{ lookup('template', 'webhook-helmchart.yaml.j2') }}"
    wait: true
  when: cert_manager_solver == "dns01"
  tags: cert-manager

- name: "Wait for Hetzner webhook deployment to be ready"
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: cert-manager
    name: cert-manager-webhook-hetzner
  register: webhook_deployment
  until: >
    webhook_deployment.resources | length > 0 and
    webhook_deployment.resources[0].status.readyReplicas is defined and
    webhook_deployment.resources[0].status.readyReplicas >= 1
  retries: 30
  delay: 10
  when: cert_manager_solver == "dns01"
  tags: cert-manager

- name: "Apply Hetzner secret for DNS-01"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'hetzner-secret.yml') }}"
  when: cert_manager_solver == "dns01"
  tags: cert-manager

- name: "Apply cert-manager issuers"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'cert-manager-issuers.yml') }}"
  tags: cert-manager

- name: "Apply Traefik redirect-to-https middleware"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'traefik-middleware.yml') }}"
  tags: cert-manager
