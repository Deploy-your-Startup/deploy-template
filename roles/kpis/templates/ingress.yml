apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kpis
  namespace: "{{ k8s_namespace | default('default') }}"
  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ k8s_namespace | default('default') }}-redirect-to-https@kubernetescrd"
spec:
  tls:
    - hosts:
        - {{ kpis_host }}
      secretName: kpis-tls
  rules:
    - host: {{ kpis_host }}
      http:
        paths:
          - path: {{ '/api/heartbeat' if kpis_bootstrap_only | default(false) else '/' }}
            pathType: {{ 'Exact' if kpis_bootstrap_only | default(false) else 'Prefix' }}
            backend:
              service:
                name: kpis
                port:
                  number: 80
