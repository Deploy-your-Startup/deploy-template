apiVersion: v1
kind: Secret
metadata:
  name: kpis
  namespace: "{{ k8s_namespace | default('default') }}"
type: Opaque
stringData:
  DATABASE_URL: {{ ('postgresql://' + kpis_db_user + ':' + (kpis_db_password | urlencode | replace('/', '%2F')) + '@' + postgres_host + ':' + (postgres_port | string) + '/' + kpis_db_name) | to_json }}
  APP_SECRET: {{ kpis_app_secret | to_json }}
  KPIS_DB_PASSWORD: {{ kpis_db_password | to_json }}
