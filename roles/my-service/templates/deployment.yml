apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-service
spec:
  selector:
    matchLabels:
      app: my-service
  template:
    metadata:
      labels:
        app: my-service
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
          - name: my-service-storage
            mountPath: /usr/share/nginx/html  # Mount path inside the container
      volumes:
        - name: my-service-storage
          persistentVolumeClaim:
           claimName: my-service-pvc
