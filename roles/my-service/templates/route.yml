apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-service
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-gateway
  hostnames:
    - "my-service.{{ base_domain }}"
    - "{{ base_domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: auth-proxy
      backendRefs:
        - name: my-service
          port: 80

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: my-service
          port: 80