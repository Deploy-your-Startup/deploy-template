apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: "{{ argocd_namespace }}"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-gateway
  hostnames:
    - "argocd.{{ base_domain }}"
    - "{{ base_domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80