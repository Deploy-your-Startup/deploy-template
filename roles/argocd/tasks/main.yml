---
- name: "Add ArgoCD Helm repository"
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm
  tags: argocd

- name: "Create argocd namespace"
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ argocd_namespace }}"
  tags: argocd

- name: "Install ArgoCD using Helm"
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values:
      server:
        extraArgs:
          - --insecure
      configs:
        params:
          server.insecure: true
  tags: argocd

- name: "Wait for ArgoCD server to be ready"
  k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300
  tags: argocd

- name: "Create GitHub repository credentials secret"
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: github-repo-creds
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ argocd_repo_url }}"
        password: "{{ github_token }}"
        username: not-used
  tags: argocd
  when: github_token is defined

- name: "Apply ArgoCD HTTPRoute definition"
  k8s:
    state: present
    namespace: "{{ argocd_namespace }}"
    definition: "{{ lookup('template', 'httproute.yml') }}"
  retries: 3
  delay: 10
  register: route_result
  until: route_result is succeeded
  tags: argocd

- name: "Create ArgoCD Application for frontend"
  k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: frontend
        namespace: "{{ argocd_namespace }}"
      spec:
        project: default
        source:
          repoURL: "{{ argocd_repo_url }}"
          targetRevision: HEAD
          path: "{{ argocd_repo_path }}"
        destination:
          server: https://kubernetes.default.svc
          namespace: frontend
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
  tags: argocd